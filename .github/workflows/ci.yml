name: CI — Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol V1–V9 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mpmath numpy matplotlib pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check laboratory.py tests/

      - name: Full protocol V1–V9 + stands + certificates
        run: |
          python3 laboratory.py --lang en --run all --no-plots

      - name: Baseline cross-check
        run: |
          python3 laboratory.py --lang en --check-baseline

      - name: C verification (exact rank over Q = 20)
        run: |
          gcc -O2 -Wall -o verify_hodge_c verification/c/verify_hodge.c -lm
          ./verify_hodge_c

      - name: Fortran verification
        run: |
          gfortran -O2 -o verify_hodge_f verification/fortran/verify_hodge.f90
          ./verify_hodge_f

      - name: Rust verification
        run: |
          rustc -O -o verify_hodge_rs verification/rust/verify_hodge.rs
          ./verify_hodge_rs

      - name: Unit tests (pytest)
        run: |
          python3 -m pytest tests/ -q

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodge-reports-py${{ matrix.python-version }}
          path: reports/
