name: Vitrine — the theorems site

# Builds the Vite+React vitrine from site/ and publishes it into
# docs/theorems-vitrine/ so the existing GitHub Pages pipeline serves it at
# <user>.github.io/hodge-laboratory/theorems-vitrine/
# (the build uses relative base './' — it also works under any subpath).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci || npm install

      - name: Build
        working-directory: site
        run: npm run build

      - name: Publish into docs/theorems-vitrine
        run: |
          rm -rf docs/theorems-vitrine
          mkdir -p docs/theorems-vitrine
          cp -r site/dist/* docs/theorems-vitrine/
          # keep covers reachable from the site: copy them next to the build
          mkdir -p docs/theorems-vitrine/covers
          cp -f theorems/assets/covers/*.png docs/theorems-vitrine/covers/ 2>/dev/null || true

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/theorems-vitrine
          git diff --cached --quiet || git commit -m "vitrine: rebuild the theorems site [skip ci]"
          git push
