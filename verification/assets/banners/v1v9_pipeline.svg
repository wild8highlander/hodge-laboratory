      <text x="349" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">equivariance</text>
      <text x="349" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-25</text>
    </g><line x1="394" y1="93" x2="398" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p4">
      <rect x="400" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="400" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="443" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V5</text>
      <text x="443" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">chain sums</text>
      <text x="443" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-25</text>
    </g><line x1="488" y1="93" x2="492" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p5">
      <rect x="494" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="494" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="537" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V6</text>
      <text x="537" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">Γ-reflection</text>
      <text x="537" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-30</text>
    </g><line x1="582" y1="93" x2="586" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p6">
      <rect x="588" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="588" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="631" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V7</text>
      <text x="631" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">HP-QR rank</text>
      <text x="631" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-9</text>
    </g><line x1="676" y1="93" x2="680" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p7">
      <rect x="682" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="682" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="725" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V8</text>
      <text x="725" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">DFT 8×225</text>
      <text x="725" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-25</text>
    </g><line x1="770" y1="93" x2="774" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p8">
      <rect x="776" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="776" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="819" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V9</text>
      <text x="819" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">deep record</text>
      <text x="819" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-100</text>
    </g>
  <text x="440" y="188" text-anchor="middle" style="font:11px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">master_hodge.py · python3 laboratory.py --run python · каждый порог — отдельное заявление, каждое — проверено</text>
