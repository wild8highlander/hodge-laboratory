<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-labelledby="vpT vpD">
  <title id="vpT">The V1-V9 protocol pipeline</title>
  <desc id="vpD">Nine stage boxes V1 through V9 with their claims and thresholds, connected left to right: genus and census, closed form vs quadrature at 1e-30, the phase law at 1e-25, equivariance, chain sums, the Gamma reflection ladder at 1e-30, the HP-QR rank check at 1e-9, DFT orthogonality on an 8x225 block, and the deep precision record at 1e-100.</desc>
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#131A2C"/>
    </linearGradient>
    <style>
      .p0{animation:pulse 2.8s ease-in-out infinite;animation-delay:0.00s}
      .p1{animation:pulse 2.8s ease-in-out infinite;animation-delay:0.22s}
      .p2{animation:pulse 2.8s ease-in-out infinite;animation-delay:0.44s}
      .p3{animation:pulse 2.8s ease-in-out infinite;animation-delay:0.66s}
      .p4{animation:pulse 2.8s ease-in-out infinite;animation-delay:0.88s}
      .p5{animation:pulse 2.8s ease-in-out infinite;animation-delay:1.10s}
      .p6{animation:pulse 2.8s ease-in-out infinite;animation-delay:1.32s}
      .p7{animation:pulse 2.8s ease-in-out infinite;animation-delay:1.54s}
      .p8{animation:pulse 2.8s ease-in-out infinite;animation-delay:1.76s}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
      @media (prefers-reduced-motion: reduce){g[class^=p]{animation:none}}
    </style>
  </defs>
  <rect width="880" height="210" fill="url(#vbg)"/>
  <rect x="1.5" y="1.5" width="877" height="207" fill="none" stroke="#2C3A5E" stroke-width="1.5" rx="14"/>
  <rect x="0" y="0" width="880" height="4" fill="#4B8BBE" rx="2"/>
  <text x="440" y="34" text-anchor="middle" style="font:700 16px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em" fill="#E8EEFA">THE V1–V9 PROTOCOL — NINE CLAIMS, NINE THRESHOLDS</text>
  <g class="p0">
      <rect x="24" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="24" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="67" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V1</text>
      <text x="67" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">genus + census</text>
      <text x="67" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-0</text>
    </g><line x1="112" y1="93" x2="116" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p1">
      <rect x="118" y="64" width="86" height="58" rx="10" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <rect x="118" y="64" width="86" height="4" rx="2" fill="#4B8BBE"/>
      <text x="161" y="86" text-anchor="middle" style="font:700 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#4B8BBE">V2</text>
      <text x="161" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">closed vs quad</text>
      <text x="161" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-30</text>
    </g><line x1="206" y1="93" x2="210" y2="93" stroke="#2C3A5E" stroke-width="2"/><g class="p2">
