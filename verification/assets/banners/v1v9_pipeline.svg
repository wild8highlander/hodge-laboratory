      <text x="255" y="104" text-anchor="middle" style="font:8.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#C9D6F2">phase law</text>
      <text x="255" y="116" text-anchor="middle" style="font:8.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">&lt; 1e-25</text>
