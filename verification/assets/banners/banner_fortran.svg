<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="bT bD">
  <title id="bT">FORTRAN  ·  gfortran verification stack</title>
  <desc id="bD">Banner of the FORTRAN  ·  gfortran verification panel: the veteran of numerical science, int64 exact</desc>
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#131A2C"/>
    </linearGradient>
    <style>
      .nm{font:700 46px 'Segoe UI',Helvetica,Arial,sans-serif}
      .bar{animation:pulse 2.6s ease-in-out infinite}
      .s0 .bar{animation:pulse 2.6s ease-in-out infinite;animation-delay:0.00s}
      .s1 .bar{animation:pulse 2.6s ease-in-out infinite;animation-delay:0.30s}
      .s2 .bar{animation:pulse 2.6s ease-in-out infinite;animation-delay:0.60s}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
      @media (prefers-reduced-motion: reduce){.bar{animation:none}}
    </style>
  </defs>
  <rect width="880" height="220" fill="url(#gbg)"/>
  <rect x="1.5" y="1.5" width="877" height="217" fill="none" stroke="#2C3A5E" stroke-width="1.5" rx="14"/>
  <rect x="0" y="0" width="880" height="4" fill="#8FA3CF" rx="2"/>
  <g transform="translate(64,110)">
    <circle r="44" fill="#162032" stroke="#8FA3CF" stroke-width="2"/>
    <text y="15" text-anchor="middle" style="font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">F</text>
  </g>
  <text x="140" y="102" class="nm" fill="#E8EEFA">FORTRAN  ·  gfortran</text>
  <text x="140" y="130" style="font:14px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">the veteran of numerical science, int64 exact</text>
  <text x="700" y="102" text-anchor="end" style="font:13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#8FA3CF">gfortran -O2 verify_hodge.f90</text>
    <g class="stat s0">
      <rect class="bar" x="64" y="152" width="184" height="4" rx="2" fill="#8FA3CF"/>
      <rect x="64" y="152" width="184" height="44" rx="9" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <text x="156" y="172" text-anchor="middle" style="font:10.5px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.14em" fill="#5871A3">PANEL CHECKS</text>
      <text x="156" y="190" text-anchor="middle" style="font:600 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#8FA3CF">24</text>
    </g>
    <g class="stat s1">
      <rect class="bar" x="264" y="152" width="184" height="4" rx="2" fill="#8FA3CF"/>
      <rect x="264" y="152" width="184" height="44" rx="9" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <text x="356" y="172" text-anchor="middle" style="font:10.5px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.14em" fill="#5871A3">ARITHMETIC</text>
      <text x="356" y="190" text-anchor="middle" style="font:600 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#8FA3CF">integer(int64)</text>
    </g>
    <g class="stat s2">
      <rect class="bar" x="464" y="152" width="184" height="4" rx="2" fill="#8FA3CF"/>
      <rect x="464" y="152" width="184" height="44" rx="9" fill="#162032" stroke="#2C3A5E" stroke-width="1"/>
      <text x="556" y="172" text-anchor="middle" style="font:10.5px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.14em" fill="#5871A3">EXIT CODES</text>
      <text x="556" y="190" text-anchor="middle" style="font:600 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#8FA3CF">0 / 1</text>
    </g>
</svg>