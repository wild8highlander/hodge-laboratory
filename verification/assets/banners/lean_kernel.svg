<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="lnT lnD">
  <title id="lnT">Lean 4 kernel — the machine layer</title>
  <desc id="lnD">Animated proof pipeline: a theorem statement flows through the elaborator into the kernel, which fully reduces both sides; the axiom list stays empty.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#11131F"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5871A3"/>
    </marker>
    <style>
      .big{font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif}
      .code{font:14px 'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .okmark{animation:ok 2.8s ease-in-out infinite}
      .o0{animation:ok 2.8s ease-in-out infinite;animation-delay:0.00s}
      .a0{animation:flow 2.2s linear infinite;animation-delay:0.00s}
      .o1{animation:ok 2.8s ease-in-out infinite;animation-delay:0.35s}
      .a1{animation:flow 2.2s linear infinite;animation-delay:0.35s}
      .o2{animation:ok 2.8s ease-in-out infinite;animation-delay:0.70s}
      .a2{animation:flow 2.2s linear infinite;animation-delay:0.70s}
      .o3{animation:ok 2.8s ease-in-out infinite;animation-delay:1.05s}
      .arrow{stroke-dasharray:10 8;animation:flow 2.2s linear infinite}
      @keyframes ok{0%,100%{opacity:1}50%{opacity:.4}}
      @keyframes flow{to{stroke-dashoffset:-36}}
      @media (prefers-reduced-motion: reduce){.okmark,.arrow{animation:none}}
    </style>
  </defs>
  <rect width="880" height="380" fill="url(#lbg)"/>
  <rect x="1.5" y="1.5" width="877" height="377" fill="none" stroke="#2C3A5E" stroke-width="1.5" rx="14"/>
  <rect x="1.5" y="1.5" width="877" height="377" fill="none" stroke="#F0C674" stroke-opacity="0.22" stroke-width="3" rx="14"/>
  <text x="440" y="66" text-anchor="middle" class="big" fill="#F0C674">LEAN 4 KERNEL</text>
  <text x="440" y="94" text-anchor="middle" style="font:14px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">the machine layer — proofs, not spot-checks</text>
  <text x="440" y="132" text-anchor="middle" class="code" fill="#7EE787">40 theorems · 12 machine-checked examples · 0 axioms · 0 sorry</text>
  <text x="440" y="160" text-anchor="middle" class="code" fill="#5871A3">leanprover/lean4:v4.36.0 · core only · no Mathlib · no native_decide</text>
  <line x1="80" y1="182" x2="800" y2="182" stroke="#22304E" stroke-width="1"/>
    <g class="st st0">
      <rect x="60" y="216" width="184" height="92" rx="10" fill="#162032" stroke="#E879F9" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="152" y="248" text-anchor="middle" style="font:600 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#E879F9">theorem</text>
      <text x="152" y="272" text-anchor="middle" style="font:11.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">statement + types</text>
      <text class="okmark o0" x="152" y="294" text-anchor="middle" style="font:700 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#3FD16B">✓ accepted</text>
    </g>
    <path class="arrow a0" d="M 248 262 L 264 262" stroke="#5871A3" stroke-width="2" marker-end="url(#ah)"/>
    <g class="st st1">
      <rect x="268" y="216" width="184" height="92" rx="10" fill="#162032" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="360" y="248" text-anchor="middle" style="font:600 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#22D3EE">elaborator</text>
      <text x="360" y="272" text-anchor="middle" style="font:11.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">tactics compiled</text>
      <text class="okmark o1" x="360" y="294" text-anchor="middle" style="font:700 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#3FD16B">✓ accepted</text>
    </g>
    <path class="arrow a1" d="M 456 262 L 472 262" stroke="#5871A3" stroke-width="2" marker-end="url(#ah)"/>
    <g class="st st2">
      <rect x="476" y="216" width="184" height="92" rx="10" fill="#162032" stroke="#F0C674" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="568" y="248" text-anchor="middle" style="font:600 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#F0C674">kernel</text>
      <text x="568" y="272" text-anchor="middle" style="font:11.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">full reduction check</text>
      <text class="okmark o2" x="568" y="294" text-anchor="middle" style="font:700 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#3FD16B">✓ accepted</text>
    </g>
    <path class="arrow a2" d="M 664 262 L 680 262" stroke="#5871A3" stroke-width="2" marker-end="url(#ah)"/>
    <g class="st st3">
      <rect x="684" y="216" width="184" height="92" rx="10" fill="#162032" stroke="#3FD16B" stroke-opacity="0.55" stroke-width="1.3"/>
      <text x="776" y="248" text-anchor="middle" style="font:600 15px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#3FD16B">axioms</text>
      <text x="776" y="272" text-anchor="middle" style="font:11.5px 'Segoe UI',Helvetica,Arial,sans-serif" fill="#8FA3CF">∅ — none required</text>
      <text class="okmark o3" x="776" y="294" text-anchor="middle" style="font:700 13px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#3FD16B">✓ accepted</text>
    </g>
  <text x="440" y="348" text-anchor="middle" style="font:12px 'SFMono-Regular',Consolas,'Liberation Mono',monospace" fill="#5871A3">#print axioms ⇒ …depends only on axioms [ ] — the list is empty</text>
</svg>