[project]
name = "hodge-laboratory"
version = "1.1.2"
description = "The Dynamic Principle Laboratory — ladder of stands, certificates A–H, closed theorem system, 5-language + Lean 4 verification"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Isaev Iskhak Khamzatovich" }
]
keywords = [
    "Hodge conjecture", "Fermat curves", "gamma normalization",
    "K3 surfaces", "Klein quartic", "cyclotomic levels",
    "computational verification", "Lean 4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Environment :: Console",
]
dependencies = [
    "mpmath>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["laboratory"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/wild8highlander/hodge-laboratory"
Documentation = "https://wild8highlander.github.io/hodge-laboratory/"
"Reference (ORCID)" = "https://orcid.org/0009-0003-7299-0701"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["monograph", "theorems", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are kept deliberate in the console banner art
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
