      an exact FORM identity (P^5 d(eta_C) = [P Div(C) -
      4 sum C_j j_j] vol) together with the Cartan identity
      P^5 d(iota_R eta_C) = -iota_R(P^5 d(eta_C)) — the divergence
      step loses nothing.  The true closure mechanism is the
      normalization gauge (C-018).
