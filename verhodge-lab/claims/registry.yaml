# Claim registry — verhodge-lab v1.10
# The asymmetric contract: every claim carries status computed /
# documented / registered / NOT_DETERMINED.  Computed claims cite the
# protocol run and the verification artifact; the acceptance criteria
# are the falsifiable commitments of docs/ROADMAP.md (Criterion 3.3).
#
# id: C-NNN | wave | title | status | evidence | falsified_by

claims:
  - id: C-001
    wave: v1.5-pre
    title: >
      The character census of the Fermat level N satisfies
      sum_d h_d = g(N) = (N-1)(N-2)/2, computed by two independent
      schemes (direct gcd enumeration and Moebius inversion) that
      agree on every conductor for N in [3, 64].
    status: computed
    evidence: protocol run V1_census_two_scheme; frozen baseline
      hodge-laboratory v1.4 (N = 7, 9, 15, 30)
    falsified_by: any conductor disagreement between the schemes

