<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Hodge Laboratory — the ladder of stands</title>
  <desc id="heroDesc">Animated hero banner: a luminous ladder ascends from a glowing calibration torus through the rungs N=7, 9, 15, 30 to a cyclotomic web; genus grows 1, 3, 28, 91, 406; the united formula Delta_Ch = lambda_0 - R/4 + delta^2/2 - delta^5/k.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.55" stop-color="#111638"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="torusGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="webGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#E879F9" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:bold 46px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F3F6FF;letter-spacing:10px}
      .subtitle{font:600 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#22D3EE;letter-spacing:3px}
      .formula{font:600 21px 'SFMono-Regular',Consolas,'Courier New',monospace;fill:#FBBF24}
      .rungN{font:bold 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}
      .rungG{font:600 14px 'SFMono-Regular',Consolas,monospace;fill:#9AB0D8}
      .badge{font:700 12.5px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px}
      .step{animation:pulse 5.2s ease-in-out infinite}
      .step2{animation-delay:1.3s}.step3{animation-delay:2.6s}.step4{animation-delay:3.9s}
      .tw{animation:twinkle 4.4s ease-in-out infinite}
      .beam{stroke-dasharray:6 14;animation:flow 3.2s linear infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
      @keyframes flow{to{stroke-dashoffset:-40}}
      @media (prefers-reduced-motion: reduce){.step,.tw,.beam{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- blueprint grid -->
  <g stroke="#4C6FFF" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M60 0V420M120 0V420M180 0V420M240 0V420M300 0V420M360 0V420M420 0V420M480 0V420M540 0V420M600 0V420M660 0V420M720 0V420M780 0V420M840 0V420M900 0V420M960 0V420M1020 0V420M1080 0V420M1140 0V420"/>
  </g>

  <!-- starfield -->
  <g fill="#C9D8FF">
    <circle class="tw" cx="95" cy="52" r="1.5"/>
    <circle class="tw" cx="230" cy="38" r="1.1" style="animation-delay:.7s"/>
    <circle class="tw" cx="372" cy="70" r="1.6" style="animation-delay:1.4s"/>
    <circle class="tw" cx="505" cy="35" r="1.2" style="animation-delay:2.1s"/>
    <circle class="tw" cx="640" cy="58" r="1.5" style="animation-delay:.4s"/>
    <circle class="tw" cx="775" cy="40" r="1.1" style="animation-delay:1.1s"/>
    <circle class="tw" cx="905" cy="66" r="1.4" style="animation-delay:2.6s"/>
    <circle class="tw" cx="120" cy="330" r="1.3" style="animation-delay:1.8s"/>
    <circle class="tw" cx="215" cy="385" r="1.1" style="animation-delay:.9s"/>
    <circle class="tw" cx="480" cy="392" r="1.3" style="animation-delay:2.3s"/>
    <circle class="tw" cx="700" cy="380" r="1.1" style="animation-delay:3s"/>
    <circle class="tw" cx="880" cy="396" r="1.4" style="animation-delay:1.6s"/>
    <circle class="tw" cx="1075" cy="330" r="1.2" style="animation-delay:.2s"/>
  </g>

  <!-- cyclotomic web (zeta_30) -->
  <g transform="translate(1050 108)">
    <circle r="76" fill="url(#webGlow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="64s" repeatCount="indefinite"/>
      <g stroke="#E879F9" stroke-opacity="0.85" stroke-width="0.9" fill="none">
      <g id="zk">
        <path d="M0-70 60.6-35 60.6 35 0 70-60.6 35-60.6-35Z" fill="none" stroke="#FBBF24" stroke-opacity="0.95" stroke-width="1.2"/>
      </g>
      <g stroke="#22D3EE" stroke-opacity="0.55">
        <path d="M0-70 21.6-22.5 70-20.4 34.6 21.4 49.5 70 0 41.4-49.5 70-34.6 21.4-70-20.4-21.6-22.5Z"/>
        <path d="M-52.4-46.6 52.4-46.6 0 70Z" stroke-opacity="0.4"/>
        <path d="M-52.4 46.6 52.4 46.6 0-70Z" stroke-opacity="0.4"/>
      </g>
      <circle r="70" fill="none" stroke="#E879F9" stroke-opacity="0.5"/>
      </g>
    </g>
    <circle r="4" fill="#FBBF24" filter="url(#soft)">
      <animate attributeName="r" values="3.4;5.2;3.4" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <text y="98" text-anchor="middle" style="font:600 12px 'SFMono-Regular',Consolas,monospace" fill="#C9B8FF">cyclotomic web · ζ₃₀</text>
  </g>

  <!-- ladder rails -->
  <g stroke="url(#rail)" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <path d="M208 322 900 118"/>
    <path d="M252 348 944 144"/>
  </g>

  <!-- energy beam along the ladder -->
  <path d="M230 335 922 131" stroke="#22D3EE" stroke-width="1.6" fill="none" class="beam" stroke-opacity="0.8"/>

  <!-- calibration torus (base) -->
  <g transform="translate(150 330)">
    <ellipse rx="86" ry="46" fill="url(#torusGlow)"/>
    <g filter="url(#soft)">
      <ellipse cx="0" cy="0" rx="62" ry="24" fill="none" stroke="#22D3EE" stroke-width="2.4" class="step"/>
      <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#7DD3FC" stroke-width="1.8" class="step" style="animation-delay:.8s"/>
      <ellipse cx="0" cy="-2" rx="62" ry="24" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.45" transform="rotate(-14)"/>
    </g>
    <circle r="3" fill="#7DD3FC"/>
    <text y="46" text-anchor="middle" style="font:600 12px 'SFMono-Regular',Consolas,monospace" fill="#9AB0D8">torus · (4, 1, 4π²) · g = 1</text>
  </g>

  <!-- rung platforms -->
  <g text-anchor="middle">
    <!-- N=7 Klein -->
    <g class="step">
      <rect x="322" y="272" width="118" height="14" rx="7" fill="#22D3EE" opacity="0.85"/>
      <rect x="322" y="272" width="118" height="14" rx="7" fill="#22D3EE" opacity="0.35" filter="url(#soft)"/>
      <text x="381" y="258" class="rungN">7</text>
      <text x="381" y="306" class="rungG">Klein · g = 3</text>
    </g>
    <!-- N=9 Macbeath -->
    <g class="step step2">
      <rect x="500" y="228" width="118" height="14" rx="7" fill="#A78BFA" opacity="0.9"/>
      <rect x="500" y="228" width="118" height="14" rx="7" fill="#A78BFA" opacity="0.35" filter="url(#soft)"/>
      <text x="559" y="214" class="rungN">9</text>
      <text x="559" y="262" class="rungG">Macbeath · g = 28</text>
    </g>
    <!-- N=15 -->
    <g class="step step3">
      <rect x="678" y="184" width="118" height="14" rx="7" fill="#E879F9" opacity="0.9"/>
      <rect x="678" y="184" width="118" height="14" rx="7" fill="#E879F9" opacity="0.4" filter="url(#soft)"/>
      <text x="737" y="170" class="rungN">15</text>
      <text x="737" y="218" class="rungG">Fermat · g = 91</text>
    </g>
    <!-- N=30 -->
    <g class="step step4">
      <rect x="856" y="140" width="118" height="14" rx="7" fill="#FBBF24" opacity="0.95"/>
      <rect x="856" y="140" width="118" height="14" rx="7" fill="#FBBF24" opacity="0.4" filter="url(#soft)"/>
      <text x="915" y="126" class="rungN">30</text>
      <text x="915" y="174" class="rungG">cyclotomic · g = 406</text>
    </g>
  </g>

  <!-- header -->
  <text x="600" y="58" text-anchor="middle" class="title">HODGE LABORATORY</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">THE DYNAMIC PRINCIPLE · THE LADDER OF STANDS</text>
  <text x="600" y="114" text-anchor="middle" class="formula">Δ_Ch = λ₀ − R/4 + δ²/2 − δ⁵/k</text>

  <!-- footer badges -->
  <g text-anchor="middle">
    <g transform="translate(322 388)">
      <rect x="-86" y="-14" width="172" height="28" rx="14" fill="#12261C" stroke="#2EA043" stroke-width="1.2"/>
      <text class="badge" fill="#3FD16B">PROTOCOL V1–V9 · ALL PASS</text>
    </g>
    <g transform="translate(536 388)">
      <rect x="-86" y="-14" width="172" height="28" rx="14" fill="#2B2113" stroke="#FBBF24" stroke-width="1.2"/>
      <text class="badge" fill="#FBBF24">CERTIFICATES A–J · 10/10</text>
    </g>
    <g transform="translate(750 388)">
      <rect x="-86" y="-14" width="172" height="28" rx="14" fill="#241A38" stroke="#9558B2" stroke-width="1.2"/>
      <text class="badge" fill="#C9A2F0">LEAN 4 · KERNEL VERIFIED</text>
    </g>
    <g transform="translate(964 388)">
      <rect x="-86" y="-14" width="172" height="28" rx="14" fill="#10283A" stroke="#22D3EE" stroke-width="1.2"/>
      <text class="badge" fill="#5BD6F5">5 LANGUAGES · INDEPENDENT</text>
    </g>
  </g>
</svg>
