<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="cmTitle cmDesc">
  <title id="cmTitle">Certificates A–J — the ten certified blocks</title>
  <desc id="cmDesc">A seamless horizontal marquee of ten glassmorphic cards, one per certificate: from the cycle certifier A to the Macbeath rung J, each with its core result and a subtle particle animation.</desc>
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#171542"/>
    </linearGradient>
    <style>
      .name{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E5ECFF}
      .res{font:600 10.5px 'SFMono-Regular',Consolas,monospace;fill:#9AB0D8}
      .deck{animation:slide 38s linear infinite}
      @keyframes slide{to{transform:translateX(-2100px)}}
      @media (prefers-reduced-motion: reduce){.deck{animation:none;transform:translateX(-410px)}}
    </style>

    <!-- card A · cycle certifier -->
    <g id="cA">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#22D3EE" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#0E2A3A" stroke="#22D3EE" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#5BD6F5">A</text>
      <g transform="translate(100 86)" stroke="#22D3EE" fill="none" stroke-width="2">
        <ellipse rx="34" ry="13"/>
        <ellipse rx="21" ry="8"/>
        <circle cx="0" cy="0" r="2" fill="#7DD3FC" stroke="none"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Cycle certifier</text>
      <text x="100" y="172" text-anchor="middle" class="res">divisor · kernel 29</text>
      <circle cx="60" cy="122" r="1.8" fill="#7DD3FC"><animate attributeName="cy" values="122;117;122;127;122" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="146" cy="118" r="1.5" fill="#22D3EE"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card B · closing kernel -->
    <g id="cB">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#38BDF8" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#0E2A3A" stroke="#38BDF8" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#7CD3FA">B</text>
      <g transform="translate(100 86)">
        <circle r="34" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#7DD3FC" stroke-width="1.4"/>
        <text y="7" text-anchor="middle" style="font:bold 17px 'SFMono-Regular',monospace" fill="#BAE6FD">29</text>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Closing kernel</text>
      <text x="100" y="172" text-anchor="middle" class="res">blind spot 29+2 → 0</text>
      <circle cx="132" cy="56" r="1.8" fill="#7DD3FC"><animate attributeName="cx" values="132;138;132;126;132" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="124" r="1.5" fill="#38BDF8"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card C · μ4-equivariance -->
    <g id="cC">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#7DD3FC" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#0E2A3A" stroke="#7DD3FC" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#A5E8F5">C</text>
      <g transform="translate(100 86)" stroke="#7DD3FC" stroke-width="2" fill="none">
        <path d="M-22-22H22V22H-22Z"/>
        <path d="M-13-24 4-24M24-13 24 4M13 24H-4M-24 13V-4" stroke-width="1.4"/>
        <circle r="3.5" fill="#E0F2FE" stroke="none"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">μ₄-equivariance</text>
      <text x="100" y="172" text-anchor="middle" class="res">22 = 1+7+7+7</text>
      <circle cx="56" cy="60" r="1.8" fill="#7DD3FC"><animate attributeName="opacity" values="1;.15;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="128" r="1.6" fill="#BAE6FD"><animate attributeName="cy" values="128;122;128" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card D · universal theorem -->
    <g id="cD">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#A5B4FC" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#1B1B3A" stroke="#A5B4FC" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#C7D2FE">D</text>
      <g transform="translate(100 86)" stroke="#A5B4FC" stroke-width="2" fill="none">
        <path d="M-26 26V-26H26V26Z" stroke-dasharray="5 5"/>
        <path d="M-26-6 6-26M26 6-6 26" stroke-width="1.2"/>
        <text y="-32" text-anchor="middle" style="font:600 12px 'SFMono-Regular',monospace" fill="#E0E7FF" stroke="none">L</text>
        <text y="44" text-anchor="middle" style="font:600 12px 'SFMono-Regular',monospace" fill="#E0E7FF" stroke="none">P</text>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Universal μ₄-theorem</text>
      <text x="100" y="172" text-anchor="middle" class="res">[L, P] = 0</text>
      <circle cx="142" cy="58" r="1.8" fill="#C7D2FE"><animate attributeName="cy" values="58;52;58" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="66" cy="126" r="1.5" fill="#A5B4FC"><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card E · flow termination -->
    <g id="cE">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#A78BFA" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#221A3E" stroke="#A78BFA" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#C4B5FD">E</text>
      <g transform="translate(100 86)" fill="none" stroke="#A78BFA" stroke-width="2">
        <path d="M0 0c9 0 16 7 16 15s-7 15-15 15-15-6-15-14 6-14 14-14" transform="rotate(40)"/>
        <path d="M6 30 12 36 4 40" stroke-width="1.6"/>
        <circle r="3" fill="#DDD6FE" stroke="none"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Flow termination</text>
      <text x="100" y="172" text-anchor="middle" class="res">t* = lcm(W,H)</text>
      <circle cx="58" cy="64" r="1.8" fill="#C4B5FD"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="122" r="1.6" fill="#A78BFA"><animate attributeName="cy" values="122;128;122" dur="6.2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card F · rationalization -->
    <g id="cF">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#C4B5FD" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#221A3E" stroke="#C4B5FD" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#DDD6FE">F</text>
      <g transform="translate(100 86)">
        <g stroke="#C4B5FD" stroke-opacity="0.5" stroke-width="1">
          <path d="M-34-24H34M-34-8H34M-34 8H34M-34 24H34M-34-24V24M-17-24V24M0-24V24M17-24V24M34-24V24"/>
        </g>
        <path d="M-28 26 30-24" stroke="#EDE9FE" stroke-width="2"/>
        <circle cx="-17" cy="-8" r="2.6" fill="#EDE9FE"/>
        <circle cx="0" cy="8" r="2.6" fill="#C4B5FD"/>
        <circle cx="17" cy="8" r="2.6" fill="#C4B5FD"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Rationalization</text>
      <text x="100" y="172" text-anchor="middle" class="res">Q = 256 · LLL: 4X²−7</text>
      <circle cx="150" cy="60" r="1.8" fill="#DDD6FE"><animate attributeName="cx" values="150;144;150" dur="7.2s" repeatCount="indefinite"/></circle>
      <circle cx="62" cy="124" r="1.5" fill="#C4B5FD"><animate attributeName="opacity" values=".25;1;.25" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card G · hodge indices -->
    <g id="cG">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#E879F9" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#36163C" stroke="#E879F9" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#F0ABFC">G</text>
      <g transform="translate(100 86)">
        <g stroke="#E879F9" stroke-opacity="0.5" stroke-width="1"><path d="M-32-32H32V32H-32ZM-16-32V32M16-32V32M-32-16H32M-32 16H32"/></g>
        <rect x="-32" y="-16" width="16" height="16" fill="#F0ABFC" fill-opacity="0.75"/>
        <rect x="16" y="16" width="16" height="16" fill="#E879F9" fill-opacity="0.6"/>
        <rect x="16" y="-16" width="16" height="16" fill="#E879F9" fill-opacity="0.35"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Hodge lattice indices</text>
      <text x="100" y="172" text-anchor="middle" class="res">λ = (2π)²|mτ−n|²/τ̄</text>
      <circle cx="56" cy="120" r="1.8" fill="#F0ABFC"><animate attributeName="cy" values="120;115;120" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="146" cy="126" r="1.5" fill="#E879F9"><animate attributeName="opacity" values="1;.2;1" dur="4.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card H · stand N=15/30 -->
    <g id="cH">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#F0ABFC" stroke-opacity="0.55"/>
      <circle cx="34" cy="30" r="17" fill="#36163C" stroke="#F0ABFC" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#F5C4FF">H</text>
      <g transform="translate(100 90)" fill="#F0ABFC">
        <rect x="-38" y="-3" width="6" height="6" rx="1"/>
        <rect x="-28" y="-3" width="6" height="6" rx="1"/>
        <rect x="-18" y="-12" width="6" height="24" rx="1" fill-opacity="0.8"/>
        <rect x="-8" y="-12" width="6" height="24" rx="1" fill-opacity="0.8"/>
        <rect x="2" y="-24" width="6" height="48" rx="1" fill-opacity="0.65"/>
        <rect x="12" y="-24" width="6" height="48" rx="1" fill-opacity="0.65"/>
        <rect x="22" y="-24" width="6" height="48" rx="1" fill-opacity="0.5"/>
        <rect x="32" y="-24" width="6" height="48" rx="1" fill-opacity="0.5"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Stand N = 15/30</text>
      <text x="100" y="172" text-anchor="middle" class="res">vol_h = 1125</text>
      <circle cx="58" cy="58" r="1.8" fill="#F5C4FF"><animate attributeName="opacity" values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="60" r="1.6" fill="#F0ABFC"><animate attributeName="cy" values="60;66;60" dur="6.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card I · hurwitz rung -->
    <g id="cI">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FBBF24" stroke-opacity="0.6"/>
      <circle cx="34" cy="30" r="17" fill="#3A2B0E" stroke="#FBBF24" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#FDE68A">I</text>
      <g transform="translate(100 86)">
        <path d="M0-34 24.7-24.7 34 0 24.7 24.7 0 34-24.7 24.7-34 0-24.7-24.7Z" fill="none" stroke="#FBBF24" stroke-width="2"/>
        <path d="M0-34 34 0M0 34 34 0M0-34-24.7 24.7M0 34 24.7-24.7" stroke="#FDE68A" stroke-width="0.9" stroke-opacity="0.7"/>
        <circle r="3.2" fill="#FDE68A"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Hurwitz rung N = 7</text>
      <text x="100" y="172" text-anchor="middle" class="res">Vieta (−1,−2,1) · GF(2)</text>
      <circle cx="60" cy="62" r="1.8" fill="#FDE68A"><animate attributeName="cy" values="62;57;62" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="144" cy="124" r="1.5" fill="#FBBF24"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- card J · macbeath rung -->
    <g id="cJ">
      <rect x="0" y="0" width="200" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FDE68A" stroke-opacity="0.6"/>
      <circle cx="34" cy="30" r="17" fill="#3A2B0E" stroke="#FDE68A" stroke-width="1.6"/>
      <text x="34" y="37" text-anchor="middle" style="font:bold 19px 'Segoe UI',sans-serif" fill="#FEF3C7">J</text>
      <g transform="translate(100 86)">
        <path d="M0-34 32.7-10.7 20.2 27.7H-20.2L-32.7-10.7Z" fill="none" stroke="#FDE68A" stroke-width="2"/>
        <g stroke="#FBBF24" stroke-width="0.8" stroke-opacity="0.8">
          <path d="M0-34 20.2 27.7M0-34-20.2 27.7M32.7-10.7-32.7-10.7M32.7-10.7-20.2 27.7M-32.7-10.7 20.2 27.7"/>
        </g>
        <circle r="3.2" fill="#FEF3C7"/>
      </g>
      <text x="100" y="152" text-anchor="middle" class="name">Macbeath rung N = 9</text>
      <text x="100" y="172" text-anchor="middle" class="res">census 28 = 1 + 27</text>
      <circle cx="56" cy="122" r="1.8" fill="#FDE68A"><animate attributeName="opacity" values=".3;1;.3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="58" r="1.6" fill="#FBBF24"><animate attributeName="cx" values="148;142;148" dur="6.4s" repeatCount="indefinite"/></circle>
    </g>
  </defs>

  <rect width="1100" height="300" fill="url(#mBg)"/>
  <g stroke="#4C6FFF" stroke-opacity="0.06"><path d="M0 76H1100M0 152H1100M0 228H1100M275 0V300M550 0V300M825 0V300"/></g>

  <text x="44" y="34" style="font:bold 17px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px" fill="#E5ECFF">THE CERTIFICATES A–J</text>
  <circle cx="990" cy="28" r="4" fill="#22D3EE"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1006" cy="28" r="4" fill="#E879F9"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1022" cy="28" r="4" fill="#FBBF24"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" begin=".9s" repeatCount="indefinite"/></circle>
  <text x="1058" y="33" text-anchor="end" style="font:600 11px 'SFMono-Regular',Consolas,monospace" fill="#9AB0D8">10/10</text>

  <!-- seamless marquee: two copies of the 10-card deck (2100 px each) -->
  <g class="deck">
    <use href="#cA" x="10" y="46"/>
    <use href="#cB" x="220" y="46"/>
    <use href="#cC" x="430" y="46"/>
    <use href="#cD" x="640" y="46"/>
    <use href="#cE" x="850" y="46"/>
    <use href="#cF" x="1060" y="46"/>
    <use href="#cG" x="1270" y="46"/>
    <use href="#cH" x="1480" y="46"/>
    <use href="#cI" x="1690" y="46"/>
    <use href="#cJ" x="1900" y="46"/>
    <use href="#cA" x="2110" y="46"/>
    <use href="#cB" x="2320" y="46"/>
    <use href="#cC" x="2530" y="46"/>
    <use href="#cD" x="2740" y="46"/>
    <use href="#cE" x="2950" y="46"/>
    <use href="#cF" x="3160" y="46"/>
    <use href="#cG" x="3370" y="46"/>
    <use href="#cH" x="3580" y="46"/>
    <use href="#cI" x="3790" y="46"/>
    <use href="#cJ" x="4000" y="46"/>
  </g>

  <rect x="0" y="0" width="46" height="300" fill="url(#mBg)" opacity="0.001"/>
</svg>
