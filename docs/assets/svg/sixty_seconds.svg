<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="ssTitle ssDesc">
  <title id="ssTitle">The program in 60 seconds — the numbers at a glance</title>
  <desc id="ssDesc">Animated terminal: the protocol run types itself out — the census 91 = 1+6+84 and 406 = 1+6+9+30+84+276, the closed-form residual 3.9e-36, the deep record 1.7e-71 at dps 70, the certificates A-J 10/10 and the final verdict ALL CHECKS PASSED in 1.9 seconds.</desc>
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A0E18"/>
    </linearGradient>
    <filter id="ssGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font:14.5px 'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .ok{fill:#3FD16B;font-weight:600}
      .ln{opacity:0;animation:lnIn 12s ease-out infinite}
      .l1{animation-delay:.2s}.l2{animation-delay:1.3s}.l3{animation-delay:2.4s}.l4{animation-delay:3.5s}
      .l5{animation-delay:4.6s}.l6{animation-delay:5.7s}.l7{animation-delay:6.8s}
      .vf{opacity:0;animation:vfIn 12s ease-out infinite;animation-delay:8.2s}
      .fx{animation:fxPulse 3.4s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes lnIn{0%,4%{opacity:0;transform:translateY(4px)}8%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
      @keyframes vfIn{0%,66%{opacity:0;transform:translateY(4px)}71%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
      @keyframes fxPulse{0%,100%{opacity:.8}50%{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.ln,.vf,.cursor,.fx{animation:none}.ln,.vf{opacity:1}}
    </style>
  </defs>

  <rect x="8" y="8" width="864" height="454" rx="14" fill="#131A2C" stroke="#2C3A5E" stroke-width="1.5"/>
  <rect x="8" y="8" width="864" height="454" rx="14" fill="none" stroke="#FBBF24" stroke-opacity="0.22" stroke-width="3"/>
  <rect x="8" y="8" width="864" height="40" rx="14" fill="#232A3F"/>
  <rect x="8" y="34" width="864" height="14" fill="#232A3F"/>
  <circle cx="34" cy="28" r="6.5" fill="#FF5F56"/>
  <circle cx="56" cy="28" r="6.5" fill="#FFBD2E"/>
  <circle cx="78" cy="28" r="6.5" fill="#27C93F"/>
  <text x="440" y="33" text-anchor="middle" style="font:600 13px 'Segoe UI',sans-serif" fill="#8FA3CF">hodge-laboratory — the program in 60 seconds</text>

  <rect x="24" y="60" width="832" height="386" rx="8" fill="url(#ssBg)"/>

  <g>
    <text x="46" y="92" class="mono" fill="#7EE787">$ python3 laboratory.py --run all</text>
    <rect class="cursor" x="290" y="79" width="9" height="16" fill="#7EE787"/>

    <text class="ln l1 mono" x="46" y="126" fill="#8FA3CF">V1 · census     <tspan fill="#5BD6F5">91 = 1+6+84</tspan> · <tspan fill="#CBB8FF">406 = 1+6+9+30+84+276</tspan>  <tspan class="ok">✓</tspan></text>
    <text class="ln l2 mono" x="46" y="156" fill="#8FA3CF">V2 · closed ↔ tanh-sinh  max dev <tspan fill="#5BD6F5">3.9·10⁻³⁶</tspan> (69 tests)  <tspan class="ok">✓</tspan></text>
    <text class="ln l3 mono" x="46" y="186" fill="#8FA3CF">V6 · reflection ladder  Γ(k/N)Γ(1−k/N) = π/sin(πk/N)  <tspan fill="#5BD6F5">7.0·10⁻³⁶</tspan>  <tspan class="ok">✓</tspan></text>
    <text class="ln l4 mono" x="46" y="216" fill="#8FA3CF">V9 · deep record  dps = 70  residual <tspan fill="#FDE68A">1.7·10⁻⁷¹</tspan>  <tspan class="ok">✓</tspan></text>
    <text class="ln l5 mono" x="46" y="246" fill="#8FA3CF">certificates A–J   <tspan fill="#FBBF24">10/10 accepted</tspan> · SNF <tspan fill="#CBB8FF">(1,1,5,5,15,15,15,15)</tspan>  <tspan class="ok">✓</tspan></text>
    <text class="ln l6 mono" x="46" y="276" fill="#8FA3CF">genera  <tspan fill="#5BD6F5">g(15) = 91</tspan> · <tspan fill="#CBB8FF">g(30) = 406</tspan> · vol_h = <tspan fill="#FDE68A">1125</tspan>  <tspan class="ok">✓</tspan></text>
    <text class="ln l7 mono" x="46" y="306" fill="#8FA3CF">lean kernel  native_decide · no axioms  <tspan class="ok">✓</tspan></text>

    <g class="vf">
      <rect x="40" y="336" width="668" height="44" rx="10" fill="#12261C" stroke="#2EA043" stroke-width="1.3"/>
      <text x="58" y="365" style="font:bold 19px 'SFMono-Regular',Consolas,monospace" fill="#3FD16B" filter="url(#ssGlow)">SUMMARY VERDICT: ALL CHECKS PASSED</text>
      <text x="600" y="365" class="mono" fill="#9AB0D8">(Time: 1.9 s)</text>
    </g>

    <g class="fx">
      <rect x="40" y="396" width="800" height="34" rx="8" fill="#241447" stroke="#FBBF24" stroke-opacity="0.55"/>
      <text x="56" y="418" style="font:600 15px 'SFMono-Regular',Consolas,monospace" fill="#FBBF24">Δ_Ch = λ₀ − R/4 + δ²/2 − δ⁵/k · δ = π/N · γ = δ⁴/k · δ_eff = δ⁵/k</text>
    </g>
  </g>
</svg>
